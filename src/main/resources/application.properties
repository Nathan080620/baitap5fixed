spring.application.name=spring
server.port=8092

# ---------- View resolver (JSP) ----------
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# ---------- SiteMesh (decorator) ----------
# Decorator nằm ở src/main/webapp/WEB-INF/decorators/
sitemesh.decorator.prefix=/WEB-INF/decorators/
sitemesh.decorator.default=web.jsp
sitemesh.decorator.mappings[0].path=/admin/*
sitemesh.decorator.mappings[0].decorator=admin.jsp

# ---------- Encoding ----------
server.tomcat.uri-encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# ---------- Database SQL Server ----------
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS01;databaseName=ltweb2;encrypt=true;trustServerCertificate=true;}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
